services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustrag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scratch/sample_docs:/data/sample_docs
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
