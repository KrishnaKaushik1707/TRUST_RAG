services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustrag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scratch/sample_docs:/data/sample_docs
      - ./scratch/chroma_db:/data/chroma_db
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustrag_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
